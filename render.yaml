services:
  - type: web
    name: p2p-connect
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm run render-build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
      - key: PORT
        generateValue: false
      - key: CLIENT_URL
        value: https://p2p-connect-wpwy.onrender.com
      - key: VITE_TURN_URL
        sync: false
      - key: VITE_TURN_USERNAME
        sync: false
      - key: VITE_TURN_CREDENTIAL
        sync: false
    healthCheckPath: /health
